spring:
  application.name: ingestion-api
  config.import: optional:file:./.env[.properties],optional:file:./back-end/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/large_data?reWriteBatchedInserts=true}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local}
    hikari.maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
  batch:
    jdbc.initialize-schema: never
    job.enabled: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:app}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me-local}
    publisher-confirm-type: correlated
    publisher-returns: true
    template.mandatory: true
    listener.simple.prefetch: 1
    listener.simple.default-requeue-rejected: false
  servlet.multipart:
    max-file-size: ${MAX_FILE_SIZE:2GB}
    max-request-size: ${MAX_REQUEST_SIZE:2056MB}
    file-size-threshold: 0B
server.port: ${SERVER_PORT:8080}
server.compression.enabled: ${SERVER_COMPRESSION_ENABLED:true}
server.compression.min-response-size: ${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:2KB}
server.compression.mime-types: ${SERVER_COMPRESSION_MIME_TYPES:text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/problem+json,application/xml}
app.upload-dir: ${UPLOAD_DIR:/data/uploads}
app.upload.max-file-size: ${MAX_FILE_SIZE:2GB}
app.business-time-zone: ${APP_BUSINESS_TIME_ZONE:America/Sao_Paulo}
app.cors.allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.messaging.outbox-interval-ms: ${OUTBOX_INTERVAL_MS:1000}
app.messaging.recovery-interval-ms: ${RECOVERY_INTERVAL_MS:60000}
app.messaging.queue-timeout-minutes: ${QUEUE_TIMEOUT_MINUTES:10}
app.records.slow-query-ms: ${RECORDS_SLOW_QUERY_MS:1000}
management.endpoints.web.exposure.include: health,info,metrics
springdoc.swagger-ui.path: /swagger-ui.html
